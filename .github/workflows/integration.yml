name: Integration

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  Lint:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
          github_token: ${{ github.token }}
      - run: just fmt-check

  Nushell:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
          github_token: ${{ github.token }}
      - run: mise exec github:nushell/nushell@0.114.1 -- just scrubs-validation-static

  Test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.14
          github_token: ${{ github.token }}
      - name: Ensure Homebrew
        shell: zsh {0}
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
      - run: brew bundle --file="${{ github.workspace }}/home/Brewfile.ci"
        shell: zsh {0}
      - run: mise install
        shell: zsh {0}
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - run: ${{ github.workspace }}/setup.sh
        shell: zsh {0}
        env:
          VIRTUAL_HOME: ${{ github.workspace }}/home
      - run: mise exec github:nushell/nushell@0.114.1 -- nu ${{ github.workspace }}/scripts/configure-apps.nu
      - run: just helix-theme-build
        shell: zsh {0}
