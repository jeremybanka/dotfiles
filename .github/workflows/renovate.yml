name: Renovate

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  discoverUpgrades:
    name: Discover Upgrades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: jeremybanka
          repositories: dotfiles
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
        env:
          LOG_LEVEL: debug
          RENOVATE_ALLOW_PLUGINS: true
          RENOVATE_ALLOWED_COMMANDS: '["^nix --extra-experimental-features nix-command --extra-experimental-features flakes flake update nixpkgs nixpkgs-unstable$"]'
          RENOVATE_REPOSITORIES: jeremybanka/dotfiles
        with:
          token: ${{ steps.app-token.outputs.token }}
